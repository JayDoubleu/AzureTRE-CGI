---
# TEMPORARY: tests the runner-dependent steps of workflows that a fork PR cannot run.
# Remove before merge.
name: "TEMP Ubuntu 26.04 probe"

on: # yamllint disable-line rule:truthy
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy_host_steps:
    name: Deploy workflow host steps
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Show runner tools
        run: |
          set -euxo pipefail
          head -3 /etc/os-release
          echo "ImageVersion=${ImageVersion:-unknown}"
          python3 --version
          jq --version
          az version --output json
          docker version
          docker info --format '{{.Driver}} {{json .DriverStatus}}'
          ls -l /var/run/docker.sock
          getent group docker
          id
          df -h /

      - name: Host Python scripts
        env:
          CI_GIT_REF: refs/pull/11/merge
          CI_LOCATION: switzerlandnorth
          CI_AZURE_ENVIRONMENT: AzureCloud
          CI_ENV_PREFIX: cgi
          TEST_BUNDLE: tre-service-azureml
        run: |
          set -euxo pipefail
          python3 devops/scripts/ci_environment_id.py \
            --ref "$CI_GIT_REF" --location "$CI_LOCATION" --cloud "$CI_AZURE_ENVIRONMENT"
          python3 devops/scripts/ci_environment_id.py --with-prefix \
            --ref "$CI_GIT_REF" --location "$CI_LOCATION" --cloud "$CI_AZURE_ENVIRONMENT"
          python3 e2e_tests/run_bundle.py --validate-only
          python3 devops/scripts/destroy_ci_ref_env.py --help
          python3 devops/scripts/ci_cleanup_scope.py --help
          python3 devops/scripts/validate_ci_cleanup.py --help
          python3 -m py_compile devops/scripts/*.py e2e_tests/run_bundle.py

      - name: Build new devcontainer
        env:
          DOCKER_BUILDKIT: 1
        run: |
          set -euxo pipefail
          USER_UID=$(id -u)
          USER_GID=$(id -g)
          docker build . \
            -t "tredev:probe" -f ".devcontainer/Dockerfile" \
            --build-arg BUILDKIT_INLINE_CACHE=1 --build-arg USER_UID="${USER_UID}" --build-arg USER_GID="${USER_GID}"
          df -h /

      - name: Docker and Porter inside the devcontainer
        run: |
          set -euxo pipefail
          cat > ./command.sh <<'EOF'
          #!/bin/bash
          set -euxo pipefail
          . devops/scripts/set_docker_sock_permission.sh
          docker version
          docker ps
          porter --version
          az version --output json
          cd templates/workspaces/base
          /workspaces/tre/devops/scripts/porter_build_bundle.sh
          EOF
          chmod +x ./command.sh
          docker run --rm --mount \
            "type=bind,src=${GITHUB_WORKSPACE},dst=/workspaces/tre" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "./command.sh:/workspaces/tre/command.sh" \
            --workdir /workspaces/tre \
            --user vscode \
            tredev:probe \
            bash -c "./command.sh"
          df -h /

  letsencrypt_host_steps:
    name: Lets Encrypt host steps (${{ matrix.os }}, az ${{ matrix.az }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            az: "2.81.0"
            expect_install: success
          - os: ubuntu-26.04
            az: "2.81.0"
            expect_install: failure
          - os: ubuntu-24.04
            az: "2.90.0"
            expect_install: success
          - os: ubuntu-26.04
            az: "2.90.0"
            expect_install: success
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      # The runner images have no Azure CLI apt source, so apt knows only the installed version.
      # https://learn.microsoft.com/cli/azure/install-azure-cli-linux?pivots=apt
      - name: Add the Microsoft Azure CLI apt repository
        run: |
          set -euxo pipefail
          sudo mkdir -p /etc/apt/keyrings
          curl -sLS https://packages.microsoft.com/keys/microsoft.asc \
            | gpg --dearmor | sudo tee /etc/apt/keyrings/microsoft.gpg > /dev/null
          sudo chmod go+r /etc/apt/keyrings/microsoft.gpg
          printf '%s\n' "Types: deb" \
            "URIs: https://packages.microsoft.com/repos/azure-cli/" \
            "Suites: $(lsb_release -cs)" \
            "Components: main" \
            "Architectures: $(dpkg --print-architecture)" \
            "Signed-by: /etc/apt/keyrings/microsoft.gpg" \
            | sudo tee /etc/apt/sources.list.d/azure-cli.sources
          sudo apt-get update

      # Same commands as lets_encrypt.yml, with the version from the matrix
      - name: Install specific Azure CLI version
        id: install
        continue-on-error: true
        env:
          AZ_VER: ${{ matrix.az }}
        run: |
          AZ_DIST=$(lsb_release -cs)

          apt-cache policy azure-cli
          sudo apt-get install azure-cli="${AZ_VER}-1~${AZ_DIST}" --allow-downgrades
          az version

      - name: Compare the install result with the expected result
        env:
          OUTCOME: ${{ steps.install.outcome }}
          EXPECTED: ${{ matrix.expect_install }}
        run: |
          echo "Azure CLI install: ${OUTCOME} (expected ${EXPECTED})"
          [ "${OUTCOME}" = "${EXPECTED}" ]

      - name: Install Terraform
        if: steps.install.outcome == 'success'
        uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: 1.14.3
          terraform_wrapper: false

      # Same commands as the Renew Certificates step, without make letsencrypt
      - name: Install Certbot
        if: steps.install.outcome == 'success'
        shell: bash
        run: |
          sudo apt-get install -y python3 python3-venv libaugeas0 \
            && python3 -m venv /opt/certbot/ \
            && /opt/certbot/bin/pip install --upgrade pip \
            && /opt/certbot/bin/pip install certbot
          /opt/certbot/bin/certbot --version
          . core/terraform/scripts/validate_certbot.sh
          terraform version

      # microsoft/AzureTRE#4593: az 2.74.0 wrote a Python warning to stdout, and the
      # storage scripts read it as a container name. No login here, so each command fails.
      - name: Azure CLI storage commands write no Python warnings
        if: steps.install.outcome == 'success'
        shell: bash
        run: |
          set -u
          az storage account show --name stprobe0000 --query "id" --output tsv >out.txt 2>err.txt || true
          az storage container list --account-name stprobe0000 --auth-mode login \
            --query "[].name" --output tsv >>out.txt 2>>err.txt || true
          az storage blob list --container-name probe --account-name stprobe0000 \
            --auth-mode login --output none >>out.txt 2>>err.txt || true
          # shellcheck disable=SC2016
          az storage blob list -o json --account-name stprobe0000 --auth-mode login \
            --container-name '$web' --query "[?name=='index.html'].name" >>out.txt 2>>err.txt || true
          echo "--- stdout"; cat out.txt
          echo "--- stderr"; cat err.txt
          if grep -E "Warning|pkg_resources" out.txt err.txt; then
            echo "::error::Azure CLI wrote a Python warning"
            exit 1
          fi
          if [ -s out.txt ]; then
            echo "::error::Azure CLI wrote to stdout without a login"
            exit 1
          fi
